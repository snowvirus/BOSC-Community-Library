name: Sync TODO issues

on:
  push:
    branches:
      - main
    paths:
      - TODO.md
      - .github/workflows/sync-todo-issues.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    name: Create missing GitHub issues
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create missing issues from TODO.md
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const todoPath = 'TODO.md';
            if (!fs.existsSync(todoPath)) {
              core.setFailed(`${todoPath} was not found.`);
              return;
            }

            const todo = fs.readFileSync(todoPath, 'utf8');
            const sections = todo
              .split(/\n---\n/g)
              .filter((section) => /^## TODO:/m.test(section));

            if (sections.length === 0) {
              core.info('No TODO issue sections found.');
              return;
            }

            const { owner, repo } = context.repo;
            const existingIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: 'all',
                per_page: 100,
              }
            );

            const existingTitles = new Set(
              existingIssues
                .filter((issue) => !issue.pull_request)
                .map((issue) => issue.title.trim())
            );

            const knownLabels = new Set(
              (
                await github.paginate(github.rest.issues.listLabelsForRepo, {
                  owner,
                  repo,
                  per_page: 100,
                })
              ).map((label) => label.name)
            );

            async function ensureLabel(name) {
              if (knownLabels.has(name)) return;

              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: 'ededed',
                });
                knownLabels.add(name);
                core.info(`Created label: ${name}`);
              } catch (error) {
                if (error.status !== 422) throw error;
                knownLabels.add(name);
              }
            }

            for (const section of sections) {
              const titleMatch = section.match(/\*\*GitHub title:\*\*\s*`([^`]+)`/);
              if (!titleMatch) {
                core.warning('Skipped a TODO section without a GitHub title.');
                continue;
              }

              const title = titleMatch[1].trim();
              if (existingTitles.has(title)) {
                core.info(`Issue already exists: ${title}`);
                continue;
              }

              const labelMatch = section.match(/\*\*Labels:\*\*\s*(.+)/);
              const labels = labelMatch
                ? [...labelMatch[1].matchAll(/`([^`]+)`/g)].map((match) => match[1])
                : [];

              for (const label of labels) {
                await ensureLabel(label);
              }

              const body = [
                '<!-- Created automatically from TODO.md. -->',
                section.trim(),
              ].join('\n\n');

              const issue = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels,
              });

              existingTitles.add(title);
              core.info(`Created issue #${issue.data.number}: ${title}`);
            }
